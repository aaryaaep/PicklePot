<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | Madhavi's Pickle Pot</title>
  <meta name="theme-color" content="#6F3517">
  <link rel="icon" type="image/png" href="/PicklePot/assets/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --dark-brown: #35180A;
      --brown: #6F3517;
      --orange: #D87920;
      --golden: #F0A928;
      --cream: #FFF8E9;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cream);
      color: var(--dark-brown);
      font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }
    .not-found { max-width: 420px; }
    .not-found img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 4px solid var(--white);
      box-shadow: 0 12px 28px -14px rgba(53, 24, 10, 0.4);
      margin-bottom: 24px;
    }
    .not-found .jar {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.7rem;
      margin: 0 0 12px;
    }
    p {
      color: #6b4a3a;
      margin: 0 0 28px;
      line-height: 1.6;
    }
    a.back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--orange);
      color: var(--white);
      text-decoration: none;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 999px;
      transition: background 0.15s ease;
    }
    a.back-button:hover { background: var(--dark-brown); }
  </style>
</head>
<body>
  <div class="not-found">
    <img src="/PicklePot/assets/logo.png" alt="Madhavi's Pickle Pot">
    <h1>Oops! This page wandered off.</h1>
    <p>Let's get you back to the pickle shop.</p>
    <a class="back-button" href="/PicklePot/">Back to Shop</a>
  </div>
</body>
</html>
